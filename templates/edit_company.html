<div class="container-fluid row justify-content-center mb-5">

    <form class="col-6" action="{{url_for('edit_company', user_id=company.user_id)}}" method="POST">
        <h1>Company Details</h1>
        <div class="mb-3">
            <label for="company_name" class="form-label">Company Name</label>
            <input type="text" class="form-control" id="company_name" name="company_name"
                value="{{company.company_name}}">
        </div>
        <div class="mb-3">
            <label for="company_mail" class="form-label">Email</label>
            <input type="email" class="form-control" id="company_mail" name="company_mail"
                value="{{company.company_mail}}">
        </div>
        <div class="mb-3">
            <label for="company_description" class="form-label">Description</label>
            <input type="text" class="form-control" id="company_description" name="company_description"
                value="{{company.company_description}}">
        </div>
        <div class="mb-3">
            <label for="website" class="form-label">Website</label>
            <input type="url" class="form-control" id="website" name="website" value="{{company.website}}">
        </div>
        <div class="mb-3">
            <label for="Hr_contact" class="form-label">Hr Contact</label>
            <input type="tel" class="form-control" id="Hr_contact" name="Hr_contact" value="{{company.Hr_contact}}">
        </div>
        <button type="submit" class="btn btn-primary">Update</button>
    </form>
</div>
