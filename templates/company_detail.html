{% extends "base.html" %}

{% block title %}Student{% endblock %}

{% block content %}

<div class="container-fluid row justify-content-center mb-5">

    <form class="col-6" action="{{url_for('companyinfo')}}" method="POST">
        <h1>Company Details</h1>
        <div class="mb-3">
            <label for="company_name" class="form-label">Company Name</label>
            <input type="text" class="form-control" id="company_name" name="company_name" placeholder="Company Name" required>
        </div>
        <div class="mb-3">
                <label for="company_mail" class="form-label">Email</label>
                <input type="email" class="form-control" id="company_mail" name="company_mail" placeholder="Enter Company Email" required>
        </div>
        <div class="mb-3">
                <label for="company_description" class="form-label">Description</label>
                <input type="text" class="form-control" id="company_description" name="company_description" placeholder="Enter Company Description">
        </div>
        <div class="mb-3">
            <label for="website" class="form-label">Website</label>
            <input type="url" class="form-control" id="website" name="website" placeholder="Enter Company Website URL">
        </div>
        <div class="mb-3">
            <label for="Hr_contact" class="form-label">Hr Contact</label>
            <input type="tel" class="form-control" id="Hr_contact" name="Hr_contact" placeholder="Contact" minlength="10" maxlength="10" title="Contact must be 10 digits long" required>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>
{% endblock %}
