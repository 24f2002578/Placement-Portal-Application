{% extends 'base.html' %}

{% block title %} Register: Be-Rozgar {% endblock %}

{% block content %}
<div class="wrapper">
    <div class="register-container">
        <h1>Be-Rozgar</h1>
        <p>Join us and shape your future.</p>
        
        <form action="/register" method="POST" class="register-form">
            <div class="form-group">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required autocomplete="name">
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="role">Role:</label>
                <select id="role" name="role" required>
                    <option value="" disabled selected>Select your Role</option>
                    <option value="student">Student</option>
                    <option value="company">Company</option>
                </select>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required autocomplete="new-password" minlength="8" maxlength="12" pattern=".*[A-Z].*" title="Password must be 8-12 characters long and contain at least 1 capital letter.">
                <small class="password-hint">Password must be 8-12 characters long and contain at least 1 capital letter.</small>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password:</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required autocomplete="new-password">
            </div>

            <button type="submit">Sign Up</button>
        </form>

        <p class="register-link">Already have an account? <a href="/login">Log in</a></p>
    </div>
</div>
{% endblock %}
