{% extends 'base.html' %}

{% block title %} Register: Be-Rozgar {% endblock %}

{% block content %}
<div class="container-fluid py-5 px-lg-5 bg-light d-flex justify-content-center align-items-center">
    <div class="col-12 col-md-6 col-lg-5 bg-white p-4 p-md-5 rounded shadow-sm border mt-4 mb-5">
        <div class="text-center mb-4">
            <h2 class="mb-1 text-dark fw-bold">Be-Rozgar</h2>
            <p class="text-muted">Join us and shape your future.</p>
        </div>

        <form action="/register" method="POST">
            <div class="mb-3">
                <label for="fullname" class="form-label fw-semibold">Full Name:</label>
                <input type="text" class="form-control" id="fullname" name="fullname" placeholder="Enter your full name" required
                    autocomplete="name">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email:</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required
                    autocomplete="email">
            </div>

            <div class="mb-3">
                <label for="role" class="form-label fw-semibold">Role:</label>
                <select class="form-select" id="role" name="role" required>
                    <option value="" disabled selected>Select your Role</option>
                    <option value="student">Student</option>
                    <option value="company">Company</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Password:</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Create a password" required
                    autocomplete="new-password" minlength="8" maxlength="12" pattern=".*[A-Z].*"
                    title="Password must be 8-12 characters long and contain at least 1 capital letter.">
                <div class="form-text text-muted">Password must be 8-12 characters long and contain at least 1 capital
                    letter.</div>
            </div>

            <div class="mb-4">
                <label for="confirm-password" class="form-label fw-semibold">Confirm Password:</label>
                <input type="password" class="form-control" id="confirm-password" name="confirm-password" placeholder="Confirm your password"
                    required autocomplete="new-password">
            </div>

            <div class="d-grid mt-4">
                <button class="btn btn-primary py-2" type="submit">Sign Up</button>
            </div>
        </form>

        <p class="text-center text-muted mt-4 mb-0">Already have an account? <a href="/login"
                class="text-decoration-none fw-semibold">Log in</a></p>
    </div>
</div>
{% endblock %}
